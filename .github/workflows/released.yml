name: released

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  bump-homebrew:
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew formula
        uses: fopina/homebrew-tap@bump-action-assets
        with:
          version: ${{ github.event.release.tag_name }}
          token: ${{ secrets.TAP_TOKEN }}
