name: release

on:
  push:
    branches-ignore:
      - '**'
    tags:
      - 'v*.*.*'

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      -
        name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.x
      -
        name: Prepare
        id: prepare
        run: |
            TAG=${GITHUB_REF#refs/tags/v}
            echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
      -
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: v${{ steps.prepare.outputs.tag_name }}

  bump-homebrew:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew formula
        uses: fopina/homebrew-tap@bump-action-assets
        with:
          version: ${{ github.ref_name }}
          token: ${{ secrets.TAP_TOKEN }}
          formula_class: Pbin
          formula_file: pbin
          description: CLI for PrivateBin allowing easy pasting from the Terminal
          bin: pbin
          test: |
            assert_match "Version: #{version}", shell_output("#{bin}/pbin -v")
